[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "lumie"
version = "0.0.1"
description = "Lightweight Units Made Intuitive & Easy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryuichi Suzuki" }]
keywords = ["units", "dimensions", "quantity", "SI", "measurement"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/RyuichiSuzuki101111/lumie"
Issues = "https://github.com/RyuichiSuzuki101111/lumie/issues"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "RUF",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["lumie"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"